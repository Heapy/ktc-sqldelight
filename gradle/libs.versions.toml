[libraries]
compiler-core = { module = "app.cash.sqldelight:core", version.ref = "sqldelight" }
compiler-env = { module = "app.cash.sqldelight:compiler-env", version.ref = "sqldelight" }
sqlite-dialect = { module = "app.cash.sqldelight:sqlite-3-38-dialect", version.ref = "sqldelight" }
