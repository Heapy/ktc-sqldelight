name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-kotlin-script
      - uses: Heapy/setup-ktc@e0a603c477110083db0b44f302deb188d4991ea0 # v1.1.0
        with:
          version: auto
      - uses: Heapy/ktc-check@4575484d8e2596bde65d671991e72fadc42ad47b # v1.1.0
        with:
          checks: tests
      - name: Validate producer packaging
        run: |
          curl --fail --location --output /tmp/ktc-plugins https://github.com/Heapy/ktc-plugins/releases/download/v0.3.0/ktc-plugins
          printf '%s\n' 'c69aa086f8f554f0097a4cbe14f6f85e00fa034c338252a1d13604fca432ac5e  /tmp/ktc-plugins' | shasum -a 256 -c -
          chmod +x /tmp/ktc-plugins
          /tmp/ktc-plugins validate
      - name: Test installation and exported runtime libraries
        env:
          GH_TOKEN: ${{ github.token }}
        run: kotlinr scripts/test-install.main.kts /tmp/ktc-plugins "$GITHUB_SHA" "$GITHUB_REPOSITORY"
